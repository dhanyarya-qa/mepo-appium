[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -s
    --tb=short
    --alluredir=reports/allure-results
    --reruns 2
    --reruns-delay 1
    --strict-markers
    -p no:warnings

markers =
    smoke: Quick smoke test scenarios
    regression: Full regression suite
    cleanup: Data cleanup and test state teardown
    negative: Negative flows
    login: Login flow tests (positive and negative)
    home: Home screen layout and feature tests
    open_trip: Open Trip Discovery feature tests
    itinerary: Create Itinerary CRUD tests
    profile: Profile page and management tests
    search: Search feature tests
    notification: Notification feature tests
    logout: Logout flow tests
    budget: Budget Tracking feature tests
    api_dependent: Tests that require backend API availability

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s │ %(levelname)-7s │ %(name)s │ %(message)s
log_cli_date_format = %H:%M:%S
